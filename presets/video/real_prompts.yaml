# presets/video/real_prompts.yaml
# Ground-truth prompt corpus for the video classifier pipeline.
# Each entry has a text and eight dimension tags. The synth generator reads
# this file and emits one steady training line per tag.
#
# Valid values for each dimension:
#   length:     short | medium | long | multi_stage
#   complexity: simple | multi_subject | multi_stage
#   style:      photorealistic | cinematic | 3d | animation | motion_graphics
#   quality:    basic | 4k | 8k | production-grade
#   camera:     static | dolly | tracking | orbital | fpv
#   physics:    none | basic | particle | cloth | fluid
#   refs:       none | image | video | multi
#   cost:       cheap | medium | expensive
#
# Add new entries by copying an existing one and pasting a new prompt +
# annotation. The classifier should learn the patterns from this file as
# the highest-quality signals; synthetic data from synth.yaml fills the gaps.

