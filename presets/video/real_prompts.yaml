      Key light from hologram casting dynamic blue flickering illumination across the face. Rim light from red emergency conduits in background.

      Physics & Detailing:
      Realistic fabric movement on jacket as character turns head at t=6s. Catchlights in eyes. Micro-expressions showing rising concern. Output format: 16:9, 24fps, cinematic master grade, no motion warping artifacts.
