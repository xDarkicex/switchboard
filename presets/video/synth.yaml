# Vocabulary drawn from the 136+ real prompts supplied by the user.
# Templates can reference these directly via slot names. Generated prompts
# use real-world cinematography vocabulary (lens specs, time markers, audio
# cues, lighting rigs) so the pipeline classifier learns the language
# production teams actually use.

vocabulary:
  cameras:
    - "slow dolly-in"
    - "whip pan"
    - "rack focus from X to Y"
    - "handheld tracking"
    - "smooth orbital"
    - "static wide shot"
    - "extreme close-up"
    - "low-angle tracking"
    - "high-angle drone"
    - "slow push-in"
    - "first-person view"
    - "POV"
    - "FPV drone dive"
    - "locked-off static"
    - "smooth crane rise"
  lighting:
    - "golden hour"
    - "blue hour"
    - "high-key studio"
    - "low-key cinematic"
    - "rim lighting"
    - "volumetric haze"
    - "neon-drenched"
    - "natural window light"
    - "warm amber key with cool blue fill"
    - "anamorphic lens flares"
    - "rain-soaked reflections"
    - "underwater caustics"
    - "specular highlights"
  audio:
    ambient:
      - "rain on metal"
      - "wind through trees"
      - "city hum"
      - "ocean waves"
      - "forest birdsong"
      - "thunder rumble"
      - "snow silence"
      - "underwater ambience"
    music:
      - "orchestral swell"
      - "lo-fi piano"
      - "synthwave"
      - "ambient drone"
      - "cinematic score"
      - "EDM beat"
      - "jazz saxophone"
    sfx:
      - "sizzle"
      - "glass shatter"
      - "thunder crack"
      - "sword clash"
      - "footsteps on gravel"
      - "wind gust"
      - "splash"
      - "engine roar"
  film_stocks:
    cinematic: ["35mm film grain", "ARRI ALEXA 65", "RED Komodo", "65mm large format", "anamorphic 2.39:1"]
    photorealistic: ["8K digital cinema", "4K RAW", "Sony Venice"]
    animation: ["Pixar-style 3D render", "Studio Ghibli render", "Studio Trigger style"]
  quality:
    - "4K"
    - "8K"
    - "1080p"
    - "60fps"
    - "24fps"
    - "120fps slow-motion"
    - "240fps high-speed"

# Intents — coherent combinations of dimensions with templates and slots.
# Each intent produces Examples with the intent's Tags.

intents:
  - name: simple_short_photorealistic
    templates:
      - "Make a video of {subject}"
      - "{duration} clip of {subject}"
      - "Cinematic shot of {subject}, {lighting}"
      - "Natural light video of {subject}"
    slots:
      subject: [
        "sunset over the ocean",
        "bird flying through the sky",
        "person walking down a street",
        "flower blooming in time lapse",
        "logo fading in on white",
        "snow falling on a forest",
        "candle flickering in the dark",
        "clock ticking on a wall",
        "rain on a window",
        "text appearing on screen",
        "a single leaf falling",
        "a candle being lit",
        "a door opening slowly",
        "a ball rolling across a table",
        "a cup of coffee being poured",
      ]
      duration: ["3 seconds", "4 seconds", "5 seconds"]
      lighting: ["natural light", "soft window light", "warm morning light"]
    tags:
      length: short
      complexity: simple
      style: photorealistic
      quality: "4k"
      camera: static
      physics: none
      refs: none
      cost: cheap

  - name: simple_short_animation
